backend:
  name: git-gateway
  branch: main # আপনার GitHub এর মেইন ব্রাঞ্চের নাম (main বা master)

# ছবি আপলোড করলে এখানে সেভ হবে
media_folder: "images/uploads"
public_folder: "/images/uploads"

# সাইটের ভাষা
locale: 'bn'

collections:
  # ============================================
  # ১. সদস্যদের ডেটা
  # ============================================
  - name: "members"
    label: "সদস্যবৃন্দ"
    files:
      - name: "members"
        label: "সদস্য তালিকা"
        file: "data/members.json"
        fields:
          - label: "সাইট তথ্য"
            name: "siteInfo"
            widget: "object"
            fields:
              - {label: "আজকের তারিখ", name: "todayDate", widget: "string"}

          - label: "আর্থিক তথ্য"
            name: "financials"
            widget: "object"
            fields:
              - {label: "মোট সঞ্চয়", name: "totalSavings", widget: "string"}
              - {label: "মোট সঞ্চয় (নিচের লেখা)", name: "totalSavingsSub", widget: "string", required: false}
              - {label: "ব্যাংক ব্যালেন্স", name: "bankBalance", widget: "string"}
              - {label: "মোট বিনিয়োগ", name: "totalInvestment", widget: "string"}
              - {label: "বর্তমান মূল্য", name: "currentValue", widget: "string"}
              - {label: "মোট লাভ/ক্ষতি", name: "totalProfit", widget: "string"}

          - label: "সদস্য তালিকা"
            name: "members"
            widget: "list"
            fields:
              - {label: "নাম", name: "name", widget: "string"}
              - {label: "পদবি (থাকলে)", name: "designation", widget: "string", required: false}
              - {label: "মোট সঞ্চয়", name: "savings", widget: "string"}
              - {label: "অংশীদারিত্ব", name: "share", widget: "string"}
              - {label: "লাভের অংশ", name: "profit", widget: "string"}
              - {label: "বর্তমান মূল্য", name: "currentValue", widget: "string"}

          - label: "সাম্প্রতিক লেনদেন"
            name: "recentTransactions"
            widget: "list"
            fields:
              - {label: "তারিখ", name: "date", widget: "string"}
              - {label: "ধরন", name: "type", widget: "string"}
              - {label: "আইকন (fa-piggy-bank, fa-university, fa-coins, fa-hand-holding-usd)", name: "icon", widget: "string", default: "fa-piggy-bank"}
              - {label: "রঙ (Hex code)", name: "color", widget: "string", default: "#388e3c"}
              - {label: "বিবরণ", name: "description", widget: "string"}
              - {label: "পরিমাণ", name: "amount", widget: "string"}
              - {label: "স্ট্যাটাস", name: "status", widget: "string", default: "সম্পন্ন"}

          - label: "বিনিয়োগ সমূহ"
            name: "investments"
            widget: "list"
            fields:
              - {label: "নাম", name: "name", widget: "string"}
              - {label: "আইকন (fa-briefcase, fa-cow, fa-chart-bar)", name: "icon", widget: "string", default: "fa-briefcase"}
              - {label: "পরিমাণ", name: "amount", widget: "string"}
              - {label: "শতকরা (%)", name: "percent", widget: "string"}